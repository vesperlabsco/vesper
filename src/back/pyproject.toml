[tool.taskipy.tasks]
install = "uv sync"
lint = "ruff check ."
format = "black . && ruff check . --fix"
typecheck = "pyright ."
run_app = "python -m app.main"
test = "pytest -v"
test_log = "pytest -v -s"
test_cov = "pytest -q --cov=app --cov-report=term-missing --cov-report=html"

[project]
name = "back"
version = "0.7.0"
description = "Change rules for network metrics"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.3",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.128.0",
    "freezegun>=1.5.5",
    "psycopg2-binary>=2.9.11",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.11.0",
    "pyrate-limiter>=4.4.0",
    "secure>=2.0.1",
    "sqlmodel>=0.0.32",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.14",
    "taskipy>=1.14.1",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["__tests__"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
sort = "cover"

